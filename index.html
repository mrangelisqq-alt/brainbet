<script>
(function () {
  var errors = [];
  function show() {
    var d = document.getElementById('bb-boot-detail');
    var t = document.getElementById('bb-boot-title');
    if (d && document.documentElement.classList.contains('bb-booting')) {
      if (t) t.textContent = 'ОШИБКА ЗАГРУЗКИ';
      d.style.whiteSpace = 'pre-wrap';
      d.style.color = '#ff8a8a';
      d.style.minHeight = '80px';
      d.style.wordBreak = 'break-all';
      d.textContent = errors.slice(-5).join('\n');
    }
  }
  window.addEventListener('error', function (e) {
    var el = e.target;
    var src = el && (el.src || el.href);
    if (src && el !== window) {
      errors.push('НЕ ЗАГРУЗИЛСЯ: ' + src);
    } else {
      errors.push('JS: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')');
    }
    show();
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    errors.push('PROMISE: ' + ((e.reason && e.reason.message) || e.reason));
    show();
  });
  setTimeout(function () {
    if (!errors.length && document.documentElement.classList.contains('bb-booting')) {
      errors.push('Ошибок JS нет. Скорее всего, не отвечает сервер/API или завис запрос.\nflags: ' + document.documentElement.className);
    }
    show();
  }, 9000);
})();
</script>
